async function getToken() {
  var accounts = msalInstance.getAllAccounts();
  if (accounts.length === 0) {
    await msalInstance.loginPopup({ scopes: SP_SCOPES });
    accounts = msalInstance.getAllAccounts();
  }
  try {
    var resp = await msalInstance.acquireTokenSilent({ scopes: SP_SCOPES, account: accounts[0] });
    return resp.accessToken;
  } catch(e) {
    var resp = await msalInstance.acquireTokenPopup({ scopes: SP_SCOPES, account: accounts[0] });
    return resp.accessToken;
  }
}

async function spFetch(url, opts) {
  var token = await getToken();
  opts = opts || {};
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opts.headers || {});
  return fetch(url, opts);
}

async function spGetItems(listName, filter) {
  var url = SP_API + "/web/lists/getbytitle('" + listName + "')/items?$top=500";
  if (filter) url += '&$filter=' + encodeURIComponent(filter);
  var r = await spFetch(url, { headers: { 'Accept': 'application/json;odata=nometadata' } });
  if (!r.ok) throw new Error('Read error ' + r.status);
  return (await r.json()).value;
}

async function spCreate(listName, data) {
  var r = await spFetch(SP_API + "/web/lists/getbytitle('" + listName + "')/items", {
    method: 'POST',
    headers: {
      'Accept': 'application/json;odata=nometadata',
      'Content-Type': 'application/json;odata=nometadata'
    },
    body: JSON.stringify(data)
  });
  if (!r.ok) { var t = await r.text(); throw new Error('Create error ' + r.status + ': ' + t.substring(0,200)); }
  return r.json();
}

function log(msg, cls) {
  var el = document.getElementById('log');
  var d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

async function runImport() {
  var btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';
  try {
    log('Authenticating…');
    await getToken();
    log('✓ Signed in', 'ok');

    // Import focus
    log('');
    log('Checking MeetingFocus for week ' + WEEK_OF + '…');
    var existing = await spGetItems('MeetingFocus', "Title eq '" + WEEK_OF + "'");
    if (existing.length > 0) {
      log('  ⚠ Focus already exists — skipping', 'warn');
    } else {
      await spCreate('MeetingFocus', {
        Title: FOCUS.weekOf,
        Focus: FOCUS.focus,
        PrioritiesJson: JSON.stringify(FOCUS.priorities)
      });
      log('  ✓ Focus imported', 'ok');
    }

    // Import member data
    log('');
    log('Importing team member data…');
    for (var i = 0; i < MEMBERS.length; i++) {
      var m = MEMBERS[i];
      log('  Checking ' + m.name + '…');
      var ex = await spGetItems('MeetingWeeklyData', "Title eq '" + m.userId + "' and WeekOf eq '" + WEEK_OF + "'");
      if (ex.length > 0) {
        log('    ⚠ Already exists — skipping', 'warn');
        continue;
      }
      await spCreate('MeetingWeeklyData', {
        Title:             m.userId,
        WeekOf:            m.weekOf,
        UserName:          m.name,
        TasksJson:         JSON.stringify(m.tasks),
        NextWeekPlansJson: JSON.stringify(m.nextWeekPlans),
        Submitted:         m.submitted,
        SubmittedAt:       m.submittedAt || ''
      });
      log('    ✓ Imported (' + m.tasks.length + ' tasks)', 'ok');
    }

    log('');
    log('✓ Import complete! Open the dashboard and navigate to week of May 10.', 'ok');
  } catch(e) {
    log('✗ ERROR: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}
